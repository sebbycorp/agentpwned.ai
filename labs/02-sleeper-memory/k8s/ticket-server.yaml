apiVersion: v1
kind: Namespace
metadata:
  name: lab02-shared
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-server
  namespace: lab02-shared
  labels:
    app: ticket-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ticket-server
  template:
    metadata:
      labels:
        app: ticket-server
    spec:
      containers:
        - name: ticket-server
          image: lab02-agent:local
          imagePullPolicy: IfNotPresent
          command: ["python3", "/app/ticket_server.py"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: ticket-server
  namespace: lab02-shared
spec:
  selector:
    app: ticket-server
  ports:
    - name: http
      port: 80
      targetPort: http
