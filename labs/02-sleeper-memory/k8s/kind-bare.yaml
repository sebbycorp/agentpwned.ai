# Bare agent kind cluster.
# kubeProxyMode nftables avoids the iptables "statistic" match. Some kernels
# (including the one this lab was authored on, 6.12.94+) reject that match,
# and then ClusterIP and in-cluster DNS never work. nftables mode is a kind
# setting, not a Substrate feature. kind 0.27+ accepts it.
#
# kind 0.29's default node is v1.33.1. That kube-proxy nftables build exits
# with "too many open files" on this kernel, so the node stays NotReady and
# the PVC provisioner cannot reach the API. The sandboxed cluster uses
# kindest/node v1.37.0. Pin the same image.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  kubeProxyMode: nftables
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
