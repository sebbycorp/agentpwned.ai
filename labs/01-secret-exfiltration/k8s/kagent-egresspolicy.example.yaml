# Arm C illustration. NOT applied by the scored scripts.
#
# Source shape: kagent main 7a0a4fd0 (2026-10-18), ahead of release tag
# v1.0.0-alpha14. That tag has no EgressPolicy CRD and no egressPolicyRefs
# field on Agent. There is no SandboxAgent CRD on either commit. The runnable
# agent resource is Agent.
#
# Do not apply this until you are on a kagent build that serves
# api.kagent.dev/v1alpha3 EgressPolicy, and you already have an AgentTemplate
# and a Harness. This file does not invent those.
apiVersion: api.kagent.dev/v1alpha3
kind: EgressPolicy
metadata:
  name: vendor-api-only
  namespace: lab01
spec:
  destinations:
    - origin: http://legit-api.lab01.svc.cluster.local
      authentication:
        header: Authorization
        prefix: "Bearer "
        secretKeyRef:
          name: vendor-api-token
          key: token
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: exfil-agent
  namespace: lab01
spec:
  template:
    ref:
      name: exfil-agent
  harnessRef:
    name: lab-harness
  egressPolicyRefs:
    - name: vendor-api-only
