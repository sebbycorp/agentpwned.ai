<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" class="run">
<title>Envoy injects the key and blocks the sink</title>
<style>
  text { font-family: "IBM Plex Sans", "Segoe UI", sans-serif; }
  .pulse { stroke-dasharray: 18 30; }
  .token { offset-rotate: 0deg; offset-distance: 100%; }
  .token.green { offset-path: path("M155 250 L370 250 L820 110"); }
  .token.leak { offset-path: path("M155 400 L155 470 L820 470 L820 400"); }
  @media (prefers-reduced-motion: no-preference) {
    .run .pulse { animation: flow 1.15s linear infinite; }
    .run .token { animation: travel 2.4s linear infinite; }
  }
  @keyframes flow { to { stroke-dashoffset: -96; } }
  @keyframes travel { from { offset-distance: 0%; } to { offset-distance: 100%; } }
</style>
<rect width="960" height="540" fill="#000000"/>
<rect x="40" y="160" width="230" height="170" rx="10" fill="#000000" stroke="#f4f1ea" stroke-width="1.75"/><text x="155" y="239" fill="#f4f1ea" font-size="20" text-anchor="middle" font-family="IBM Plex Sans, Segoe UI, sans-serif">actor</text><text x="155" y="263" fill="#f4f1ea" font-size="14" text-anchor="middle" font-family="IBM Plex Sans, Segoe UI, sans-serif">no canary</text>
<rect x="390" y="28" width="160" height="58" rx="10" fill="#000000" stroke="#f4f1ea" stroke-width="1.75"/><text x="470" y="51" fill="#f4f1ea" font-size="20" text-anchor="middle" font-family="IBM Plex Sans, Segoe UI, sans-serif">canary</text><text x="470" y="75" fill="#f4f1ea" font-size="14" text-anchor="middle" font-family="IBM Plex Sans, Segoe UI, sans-serif">outside</text>
<rect x="360" y="150" width="220" height="130" rx="10" fill="#000000" stroke="#f4f1ea" stroke-width="1.75"/><text x="470" y="209" fill="#f4f1ea" font-size="20" text-anchor="middle" font-family="IBM Plex Sans, Segoe UI, sans-serif">envoy</text><text x="470" y="233" fill="#f4f1ea" font-size="14" text-anchor="middle" font-family="IBM Plex Sans, Segoe UI, sans-serif">v0.5.0</text>
<rect x="720" y="40" width="200" height="100" rx="10" fill="#000000" stroke="#39ff14" stroke-width="1.75"/><text x="820" y="84" fill="#39ff14" font-size="20" text-anchor="middle" font-family="IBM Plex Sans, Segoe UI, sans-serif">legit API</text><text x="820" y="108" fill="#39ff14" font-size="14" text-anchor="middle" font-family="IBM Plex Sans, Segoe UI, sans-serif">HTTP 200</text>
<rect x="720" y="340" width="200" height="110" rx="10" fill="#000000" stroke="#ff3b30" stroke-width="1.75"/><text x="820" y="389" fill="#ff3b30" font-size="20" text-anchor="middle" font-family="IBM Plex Sans, Segoe UI, sans-serif">sink</text><text x="820" y="413" fill="#ff3b30" font-size="14" text-anchor="middle" font-family="IBM Plex Sans, Segoe UI, sans-serif">blocked</text>
<path d="M155 250 L370 250 L820 110" fill="none" stroke="#39ff14" stroke-width="2.25" stroke-linejoin="round"/>
<path class="pulse" d="M155 250 L370 250 L820 110" fill="none" stroke="#39ff14" stroke-width="2.25" stroke-linejoin="round"/>
<text x="520" y="236" fill="#39ff14" font-size="16" text-anchor="middle" font-family="IBM Plex Sans, Segoe UI, sans-serif">injected</text>
<circle class="token green" r="7" fill="#39ff14"/>
<path d="M155 310 L300 430" fill="none" stroke="#ff3b30" stroke-width="2.25" stroke-linecap="round"/>
<path class="pulse" d="M155 310 L300 430" fill="none" stroke="#ff3b30" stroke-width="2.25" stroke-linecap="round"/>
<text x="250" y="400" fill="#ff3b30" font-size="16" text-anchor="middle" font-family="IBM Plex Sans, Segoe UI, sans-serif">blocked</text>
